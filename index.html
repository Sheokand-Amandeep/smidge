<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <title>Smidge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; background: #1a1512; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center;
           font-family: 'Manrope', -apple-system, system-ui, sans-serif; }
    #root { position: relative; width: min(390px,100vw); height: min(844px,100svh);
            border-radius: clamp(0px, (100vw - 390px) * -100, 44px);
            overflow: hidden; box-shadow: 0 25px 100px rgba(0,0,0,.6); }
    @keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} }
    @keyframes slideInRight { from{transform:translateX(100%)} to{transform:translateX(0)} }
    @keyframes slideInLeft  { from{transform:translateX(-100%)} to{transform:translateX(0)} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    .sk-hand { font-family:'Caveat',cursive; }
    .screen-slide-in  { animation: slideInRight .28s cubic-bezier(.2,.7,.3,1) both; }
    .screen-slide-back { animation: slideInLeft  .28s cubic-bezier(.2,.7,.3,1) both; }
    input[type=range] { -webkit-appearance:none; appearance:none; outline:none; background:transparent; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:20px; height:20px;
      border-radius:50%; background:#c4593a; border:2px solid #2e2421; cursor:pointer; }
    input[type=range]::-webkit-slider-runnable-track { height:8px; border-radius:4px; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="design.js"></script>
  <script type="text/babel" src="data.js"></script>
  <script type="text/babel" src="screens.js"></script>
  <script type="text/babel" src="app.js"></script>
</body>
</html>
